name: reviewdog
on: [pull_request]
jobs:
  misspell:
    name: runner / misspell
    permissions:
      pull-requests: read
      issues: read
      repository-projects: read
    runs-on: ubuntu-latest
    steps:
      - name: Check out code.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: misspell
        uses: reviewdog/action-misspell@7cea3d501cb3834c688e08c89ed77b71764d1784
        with:
          github_token: ${{ secrets.github_token }}
          locale: "US"
          pattern: "*.md"
